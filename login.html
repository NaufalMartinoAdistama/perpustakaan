<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SIMPEL-LAB - Sistem Peminjaman Lab Komputer</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231E40AF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='3' width='20' height='14' rx='2' ry='2'/><line x1='8' y1='21' x2='16' y2='21'/><line x1='12' y1='17' x2='12' y2='21'/></svg>" type="image/svg+xml">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-blue-100 via-sky-50 to-white text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Decorative background circles -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-300/30 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-sky-200/40 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <div class="relative w-full max-w-md">
    
    <!-- Header Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-sky-400 text-white shadow-lg shadow-blue-500/25 mb-3 hover:scale-105 transition-transform">
        <i data-lucide="monitor" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">SIMPEL<span class="text-blue-600">LAB</span></h1>
      <p class="text-xs text-slate-500 mt-1">Sistem Peminjaman Barang Laboratorium Komputer</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-xl shadow-blue-900/5 border border-blue-100 p-6 sm:p-10">
      
      <div class="mb-6">
        <h2 class="text-xl font-bold text-slate-900">Selamat Datang!</h2>
        <p class="text-xs text-slate-500 mt-1">Silakan masuk menggunakan akun Anda untuk melanjutkan</p>
      </div>

      <!-- Alert Box -->
      <div id="login-alert" class="hidden mb-5 p-3.5 rounded-xl text-xs flex items-start gap-2.5">
        <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 shrink-0"></i>
        <span id="login-alert-text">-</span>
      </div>

      <!-- Form Login -->
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Username / NIS</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input 
              type="text" 
              id="input-username" 
              required 
              placeholder="admin, petugas, atau NIS (20241001)" 
              class="w-full pl-10 pr-4 py-2.5 text-xs bg-blue-50/50 border border-blue-200/80 rounded-xl focus:ring-2 focus:ring-brand-500 focus:bg-white focus:outline-none transition-all font-medium"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
            <span class="text-[11px] text-slate-400">Default: username123</span>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input 
              type="password" 
              id="input-password" 
              required 
              placeholder="Masukkan password Anda..." 
              class="w-full pl-10 pr-10 py-2.5 text-xs bg-blue-50/50 border border-blue-200/80 rounded-xl focus:ring-2 focus:ring-brand-500 focus:bg-white focus:outline-none transition-all font-medium"
            >
            <button 
              type="button" 
              id="btn-toggle-pass" 
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
            >
              <i data-lucide="eye" id="pass-icon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-brand-500/30 transition-all flex items-center justify-center gap-2 mt-2 hover:scale-[1.01]"
        >
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>Masuk Sekarang</span>
        </button>
      </form>

      <!-- Quick 1-Click Demo Buttons -->
      <div class="mt-6 pt-5 border-t border-blue-100">
        <span class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider text-center mb-3">
          Atau Masuk Cepat (Mode Demo 1-Klik)
        </span>
        <div class="grid grid-cols-3 gap-2">
          <button 
            type="button" 
            onclick="quickLoginRole('admin')"
            class="py-2 px-2 bg-blue-50 hover:bg-blue-100 text-blue-800 rounded-xl font-bold text-[11px] flex flex-col items-center justify-center gap-1 transition-all border border-blue-200/60 shadow-xs"
          >
            <i data-lucide="shield-check" class="w-4 h-4 text-blue-600"></i>
            <span>1. Admin</span>
          </button>

          <button 
            type="button" 
            onclick="quickLoginRole('petugas')"
            class="py-2 px-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-xl font-bold text-[11px] flex flex-col items-center justify-center gap-1 transition-all border border-emerald-200/60 shadow-xs"
          >
            <i data-lucide="clipboard-check" class="w-4 h-4 text-emerald-600"></i>
            <span>2. Petugas</span>
          </button>

          <button 
            type="button" 
            onclick="quickLoginRole('siswa')"
            class="py-2 px-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-800 rounded-xl font-bold text-[11px] flex flex-col items-center justify-center gap-1 transition-all border border-indigo-200/60 shadow-xs"
          >
            <i data-lucide="graduation-cap" class="w-4 h-4 text-indigo-600"></i>
            <span>3. Siswa</span>
          </button>
        </div>
      </div>

      <!-- Registration link -->
      <div class="mt-6 text-center text-xs text-slate-500">
        Belum memiliki akun siswa? 
        <a href="register.html" class="font-bold text-brand-600 hover:text-brand-800 underline ml-0.5">Daftar Akun Baru</a>
      </div>

    </div>

    <!-- Back to Portal Home -->
    <div class="text-center mt-6">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Kembali ke Beranda Utama</span>
      </a>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();

    // Check if already logged in
    const currentSession = window.authService.getSession();
    if (currentSession) {
      redirectToDashboard(currentSession.role);
    }

    // Check query params for alerts
    const urlParams = new URLSearchParams(window.location.search);
    const msg = urlParams.get('message');
    const registered = urlParams.get('registered');
    const alertBox = document.getElementById('login-alert');
    const alertText = document.getElementById('login-alert-text');

    if (registered) {
      alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs flex items-start gap-2.5 bg-emerald-50 text-emerald-800 border border-emerald-200';
      alertText.textContent = 'Registrasi berhasil! Silakan login dengan NIS dan password yang baru Anda buat.';
      alertBox.classList.remove('hidden');
    } else if (msg) {
      alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs flex items-start gap-2.5 bg-amber-50 text-amber-800 border border-amber-200';
      alertText.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    // Toggle password visibility
    const togglePassBtn = document.getElementById('btn-toggle-pass');
    const passInput = document.getElementById('input-password');
    const passIcon = document.getElementById('pass-icon');

    togglePassBtn.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
        passIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passInput.type = 'password';
        passIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    });

    // Handle Form Submit
    document.getElementById('form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('input-username').value.trim();
      const password = document.getElementById('input-password').value.trim();

      const result = window.authService.login(username, password);
      if (result.success) {
        showLoginToast(`Selamat datang, ${result.user.name}!`, 'success');
        setTimeout(() => {
          redirectToDashboard(result.user.role);
        }, 600);
      } else {
        alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs flex items-start gap-2.5 bg-rose-50 text-rose-800 border border-rose-200';
        alertText.textContent = result.message;
        alertBox.classList.remove('hidden');
        lucide.createIcons();
      }
    });

    // 1-Click Demo Login
    function quickLoginRole(role) {
      const result = window.authService.quickLogin(role);
      if (result.success) {
        showLoginToast(`Login berhasil sebagai ${role.toUpperCase()}`, 'success');
        setTimeout(() => {
          redirectToDashboard(role);
        }, 500);
      }
    }

    function redirectToDashboard(role) {
      if (role === 'admin') window.location.href = 'admin/index.html';
      else if (role === 'petugas') window.location.href = 'petugas/index.html';
      else window.location.href = 'siswa/index.html';
    }

    function showLoginToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-white p-3.5 rounded-2xl shadow-2xl border border-slate-100 flex items-center gap-2.5 text-xs font-semibold text-slate-800';
      toast.innerHTML = `
        <span class="w-2 h-2 rounded-full ${type === 'success' ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
        <span>${message}</span>
      `;
      container.appendChild(toast);
    }
  </script>
</body>
</html>
